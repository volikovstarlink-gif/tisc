<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#517DA2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tisc</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- ===== SERVER SETUP (for APK) ===== -->
  <div id="setup-screen" class="screen">
    <div class="login-wrap">
      <div class="login-logo">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6AB2F2"/>
            <stop offset="100%" stop-color="#3A8FD6"/>
          </linearGradient></defs>
          <circle cx="60" cy="60" r="60" fill="url(#lg2)"/>
          <text x="60" y="68" text-anchor="middle" font-size="52" font-weight="700" fill="#fff" font-family="sans-serif">T</text>
        </svg>
      </div>
      <h1 class="login-title">Tisc</h1>
      <p class="login-sub">Подключись к серверу</p>
      <div class="login-form">
        <div class="input-group">
          <input type="url" id="server-input" placeholder=" " autocomplete="off">
          <label>URL сервера (https://...)</label>
        </div>
        <button id="server-btn" class="btn-primary">ПОДКЛЮЧИТЬСЯ</button>
      </div>
    </div>
  </div>

  <!-- ===== LOGIN ===== -->
  <div id="login-screen" class="screen active">
    <div class="login-wrap">
      <div class="login-logo">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6AB2F2"/>
            <stop offset="100%" stop-color="#3A8FD6"/>
          </linearGradient></defs>
          <circle cx="60" cy="60" r="60" fill="url(#lg)"/>
          <text x="60" y="68" text-anchor="middle" font-size="52" font-weight="700" fill="#fff" font-family="sans-serif">T</text>
        </svg>
      </div>
      <h1 class="login-title">Tisc</h1>
      <p class="login-sub">Приватный мессенджер</p>
      <div class="login-form">
        <div class="input-group">
          <input type="text" id="username-input" placeholder=" " maxlength="20" autocomplete="off">
          <label>Твоё имя</label>
        </div>
        <button id="login-btn" class="btn-primary">ВОЙТИ</button>
      </div>
    </div>
  </div>

  <!-- ===== CHATS LIST ===== -->
  <div id="chats-screen" class="screen">
    <div class="toolbar">
      <button id="menu-btn" class="toolbar-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <h1 class="toolbar-title">Tisc</h1>
      <button id="search-btn" class="toolbar-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
    <div id="chats-list" class="scroll-content"></div>
    <!-- Sidebar / drawer -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-avatar" id="sidebar-avatar">U</div>
        <div class="sidebar-name" id="sidebar-name">User</div>
      </div>
      <div class="sidebar-menu">
        <div class="sidebar-item" id="sidebar-share">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
          <span>Поделиться ссылкой</span>
        </div>
        <div class="sidebar-item" id="sidebar-logout">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
          <span>Выйти</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== CHAT ===== -->
  <div id="chat-screen" class="screen">
    <div class="toolbar chat-toolbar">
      <button id="back-btn" class="toolbar-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="chat-toolbar-info" id="chat-toolbar-info">
        <div class="chat-toolbar-avatar" id="chat-avatar">U</div>
        <div class="chat-toolbar-text">
          <div class="chat-toolbar-name" id="chat-name"></div>
          <div class="chat-toolbar-status" id="chat-status"></div>
        </div>
      </div>
    </div>
    <div id="messages" class="messages-area"></div>
    <div id="typing-bar" class="typing-bar hidden">
      <span id="typing-text"></span>
    </div>
    <div class="compose-bar">
      <input type="text" id="msg-input" placeholder="Сообщение" autocomplete="off">
      <button id="send-btn" class="send-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // Server URL — change this to your deployed server URL
    window.TISC_SERVER = localStorage.getItem('tisc_server') || 'https://tisc.onrender.com';
  </script>
  <script src="/app.js"></script>
</body>
</html>
